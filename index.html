  .envelope-flap.open{transform:rotateX(180deg);}
  @media (prefers-reduced-motion: reduce){ .wax-pulse,.float-slow,.fade-up{animation:none!important;} .envelope-flap{transition:none!important;} }

function Parrot({size=56, color='var(--beige)'}) {
  return (
    <svg width={size} height={size} viewBox="0 0 100 100" fill="none">
      <path d="M55 20c8-6 18-4 20 5 2 8-4 15-11 17l3 9c1 3-1 6-4 6h-3" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
      <path d="M55 20c-10-2-18 4-19 13-1 8 5 14 13 15" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
      <path d="M49 48c0 10-6 17-14 19" stroke={color} strokeWidth="2" strokeLinecap="round"/>
      <circle cx="58" cy="27" r="1.6" fill={color}/>
      <path d="M20 66h55" stroke={color} strokeWidth="2" strokeLinecap="round"/>
      <path d="M28 66c-3-3-3-7 0-9" stroke={color} strokeWidth="1.6" strokeLinecap="round"/>
      <path d="M65 66c3-3 3-7 0-9" stroke={color} strokeWidth="1.6" strokeLinecap="round"/>
    </svg>
  );
}

function Envelope({onOpen}) {
  const [opening, setOpening] = useState(false);
  const handle = () => {
    if (typeof window.__playBgMusic === 'function') window.__playBgMusic();
    if (typeof window.__playVideo === 'function') window.__playVideo();
    setOpening(true);
    setTimeout(onOpen, 1000);
  };
  return (
    <div className="min-h-screen flex flex-col items-center justify-center" style={{background:'var(--plum)'}}>
      <div className="relative w-72 h-48" style={{perspective:'1200px'}}>
        <div className="absolute inset-0 rounded-sm" style={{background:'linear-gradient(160deg,#4a1f38,#2c1220)', boxShadow:'0 20px 50px rgba(0,0,0,.5)'}}></div>
        <div className={"absolute left-0 right-0 top-0 h-24 envelope-flap " + (opening ? "open" : "")}
             style={{background:'linear-gradient(160deg,#4a1f38,#2c1220)', clipPath:'polygon(0 0, 100% 0, 50% 100%)', zIndex:20}}></div>
        <button onClick={handle} aria-label="افتح"
          className="absolute rounded-full flex items-center justify-center wax-pulse"
          style={{width:56, height:56, left:'50%', top:'42%', transform:'translate(-50%,-50%)', background:'radial-gradient(circle at 35% 30%, #f7f2e6, var(--beige))', boxShadow:'inset 0 2px 4px rgba(255,255,255,.5), 0 4px 10px rgba(0,0,0,.4)', zIndex:30, border:'2px solid #fbf8ef'}}>
          <Parrot size={30} color="var(--plum)" />
        </button>
      </div>
      <p className="mt-10 text-sm font-ar" style={{color:'var(--lilac)'}}>المس الختم للفتح</p>
    </div>
  );
}

function CardContent({goDua}) {
  return (
    <React.Fragment>
      <a href={MAP_URL} target="_blank" rel="noopener" aria-label="جراند حياة"
        style={{position:'absolute', top:'71.5%', left:'60%', width:'34%', height:'3.6%', zIndex:30}}></a>
      <button onClick={goDua}
        className="absolute font-ar text-sm px-6 py-2.5 rounded-full"
        style={{top:'calc(80% - 15px)', left:'50%', transform:'translateX(-50%) scale(0.7)', background:'var(--beige)', color:'var(--plum)', whiteSpace:'nowrap', zIndex:30}}>
        شارِكنا بدعوة طيبة
      </button>
    </React.Fragment>
  );
}

function DuaContent({goBack, db}) {
  const duas = ['بارك الله لكما وبارك عليكما وجمع بينكما في خير', 'وفق الله بينكما في الخير', 'اللهم بارك لهما وأدم عليهما المودة والرحمة'];
  const [opened, setOpened] = useState([]);
  const [popup, setPopup] = useState(null);
  const [note, setNote] = useState('');
  const [sent, setSent] = useState(false);
  const click = (i) => { setPopup(duas[i]); if (!opened.includes(i)) setOpened([...opened, i]); };
  const positions = [{right:'22%', top:'50%'}, {right:'50%', top:'50%'}, {right:'75%', top:'50%'}];
  const send = async () => {
    if (!note.trim()) return;
    setSent(true);
    try {
      await fetch('https://formspree.io/f/mqpadoaq', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ message: note.trim() })
      });
    } catch (e) {}
    try {
      if (db) {
        await db.collection('duas').add({ text: note.trim(), at: Date.now() });
      }
    } catch (e) {}
  };
  return (
    <React.Fragment>
      <img src={EMPTY_BG_IMG} alt="" className="absolute inset-0 w-full h-full object-cover" style={{zIndex:15, borderRadius:'2px'}} />
      <div className="absolute" style={{top:'11%', left:'6%', right:'6%', bottom:'9%', background:'transparent', zIndex:30}}>
        <div className="max-w-sm mx-auto px-6 pt-2 h-full flex flex-col">
          <button onClick={goBack} className="font-ar text-sm mb-4 mx-auto block text-center" style={{color:'var(--lilac)'}}>‹ عودة</button>

          <div className="relative w-full h-36 mb-4">
            <svg viewBox="0 0 300 130" className="w-full h-full">
              <path d="M10 65 L290 65" stroke="var(--slate)" strokeWidth="2.5" fill="none" strokeLinecap="round"/>
            </svg>
            {positions.map((p,i)=>(
              <button key={i} onClick={()=>click(i)} style={{position:'absolute', right:p.right, top:p.top}} className="float-slow translate-x-1/2 -translate-y-1/2">
                <span className="block rounded-full" style={{width:18, height:18,
                  background: opened.includes(i) ? 'var(--slate)' : 'radial-gradient(circle, #F4EEDF 0%, #D9C9A6 100%)',
                  boxShadow: opened.includes(i) ? 'none' : '0 0 10px rgba(217,201,166,.55)'}}></span>
              </button>
            ))}
          </div>

          {popup && (
            <div className="fade-up mb-4 p-3 rounded-lg text-center" style={{background:'var(--lavender)', border:'1px solid rgba(212,175,55,.35)'}}>
              <p className="font-ar text-base leading-relaxed" style={{color:'var(--plum)'}}>{popup}</p>
            </div>
          )}

          <div>
            {sent ? (
              <p className="text-sm font-ar" style={{color:'var(--gold)'}}>شكراً لك — وصلت دعوتك بكل حب.</p>
            ) : (
              <React.Fragment>
                <textarea value={note} onChange={e=>setNote(e.target.value)} placeholder="شاركنا بدعوة" rows={3}
                  className="w-full rounded-lg p-3 text-sm outline-none font-ar"
                  style={{background:'var(--lavender)', color:'var(--plum)', border:'1px solid rgba(90,101,120,.25)'}}></textarea>
                <button onClick={send} className="mt-2 px-5 py-2 rounded-full text-sm font-ar"
                  style={{background:'var(--plum)', color:'var(--gold)'}}>أرسل الدعوة</button>
              </React.Fragment>
            )}
          </div>
        </div>
      </div>
    </React.Fragment>
  );
}

function App() {
  const [page, setPage] = useState('envelope'); // 'envelope' | 'card' | 'dua'
  const [db, setDb] = useState(null);
  const videoRef = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const d = await window.claude.use('db');
        setDb(d);
      } catch (e) {}
    })();
  }, []);

  useEffect(() => {
    let cancelled = false;
    function tryInit() {
      if (cancelled) return;
      if (window.Vimeo && videoRef.current) {
        window.__vimeoPlayer = new Vimeo.Player(videoRef.current);
      } else {
        setTimeout(tryInit, 150);
      }
    }
    tryInit();
    return () => { cancelled = true; };
  }, []);

  return (
    <React.Fragment>
      {/*
        This stage is mounted once and stays mounted for the whole session —
        the video iframe inside it is never unmounted when switching between
        the invitation page and the duas page, so playback carries on.
      */}
      <div className="min-h-screen fade-up flex items-center justify-center py-6" style={{background:'var(--plum)'}}>
        <div className="relative w-full max-w-md" style={{aspectRatio:'1240/1748'}}>
          <img src={BG_IMG} alt="" className="absolute inset-0 w-full h-full object-cover" style={{zIndex:0, borderRadius:'2px'}} />
          <iframe
            ref={videoRef}
            src="https://player.vimeo.com/video/1230464042?title=0&byline=0&portrait=0&controls=0&autoplay=0&muted=1&dnt=1"
            className="absolute inset-0 w-full h-full"
            style={{border:0, zIndex:10, pointerEvents:'none', borderRadius:'2px'}}
            allow="autoplay; fullscreen"
            title="فيديو الدعوة"
          ></iframe>

          {page === 'card' && <CardContent goDua={()=>setPage('dua')} />}
          {page === 'dua' && <DuaContent goBack={()=>setPage('card')} db={db} />}
        </div>
      </div>

      {page === 'envelope' && (
        <div className="fixed inset-0" style={{zIndex:50}}>
          <Envelope onOpen={()=>setPage('card')} />
        </div>
      )}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
